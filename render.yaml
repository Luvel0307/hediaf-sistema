# =============================================================
# HeDiaF — Configuración de deployment para Render.com
# =============================================================
# Instrucciones:
#   1. Sube este repositorio a GitHub
#   2. En Render, crea un "New Blueprint Instance"
#   3. Conecta tu repo de GitHub
#   4. Render detectará este archivo y creará los servicios
# =============================================================

databases:
  - name: hediaf-db
    plan: free
    databaseName: hediaf_pie_diabetico
    user: hediaf_user
    region: oregon

services:
  - type: web
    name: hediaf-pie-diabetico
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 2 --timeout 120"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hediaf-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
      - key: TF_ENABLE_ONEDNN_OPTS
        value: "0"
